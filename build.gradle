def groupIdEnv = System.getenv('MAVEN_GROUP_ID')
if (!groupIdEnv) {
    groupIdEnv = 'org.infinispan'
}
group groupIdEnv

def versionEnv = System.getenv('VERSION')
if (!versionEnv) {
    throw new GradleException('VERSION environment variable must be set')
}
version(versionEnv)

// ✅ Ensure all Java compile tasks use UTF-8
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
    options.charSet = 'UTF-8'
    options.docEncoding = 'UTF-8'
}

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

repositories {
    mavenLocal()
    mavenCentral()
}

subprojects { it ->
    if (!['android', 'android-test', 'jpms-example'].contains(it.name)) {
        apply plugin: 'java'

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(8)
            }

            withSourcesJar()
            withJavadocJar()
        }
    }
}

// jpms-example requests a JDK 9 toolchain upstream, but no vendor ships a JDK 9
// for macOS/aarch64, so Gradle auto-provisioning 404s on Apple Silicon runners
// (the old api.adoptopenjdk.net endpoint is also defunct). JPMS only needs
// JDK 9+, so override to JDK 17 — available on every CI runner. Done in
// projectsEvaluated so it runs after jpms-example's own build script sets of(9).
gradle.projectsEvaluated {
    def jpms = findProject(':jpms-example')
    if (jpms != null) {
        def javaExt = jpms.extensions.findByType(JavaPluginExtension)
        if (javaExt != null) {
            javaExt.toolchain.languageVersion = JavaLanguageVersion.of(17)
        }
    }
}

ext {
    jdk = JavaVersion.current().majorVersion
    jdkJavadoc = "https://docs.oracle.com/javase/8/docs/api/"
    println "JDK Javadoc link for this build is ${rootProject.jdkJavadoc}"
}

apply from: 'publish.gradle'
apply from: 'jacoco.gradle'

tasks.register('allJavadoc', Javadoc) {
    Set<String> projects = [
            'lua51',
            'lua52',
            'lua53',
            'lua54',
            'luajit',
            'luaj',
            'luajava',
    ]
    source subprojects
            .findAll { projects.contains(it.name) }
            .collect { it.sourceSets.main.allJava }
    classpath = files(subprojects.findAll { projects.contains(it.name) }
            .collect { it.sourceSets.main.compileClasspath })
    exclude(
            '**/party/iroiro/luajava/util/**',
            '**/party/iroiro/luajava/cleaner/**',
    )
    destinationDir = file("${buildDir}/docs/javadoc")
}
